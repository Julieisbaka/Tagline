name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache installed dependencies
        id: dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-onnx-skip-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Cache renderer build
        id: renderer
        uses: actions/cache@v4
        with:
          path: dist
          key: renderer-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package.json', 'package-lock.json', 'index.html', 'vite.config.mjs', 'src/**', 'electron/**', 'public/**') }}

      - name: Build renderer
        if: steps.renderer.outputs.cache-hit != 'true'
        run: npm run build

      - name: Share renderer build
        uses: actions/upload-artifact@v4
        with:
          name: renderer-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  lint-and-test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        id: dependencies
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-onnx-skip-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install dependencies on cache miss
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

  smoke:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        id: dependencies
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-onnx-skip-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install dependencies on cache miss
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - uses: actions/download-artifact@v4
        with:
          name: renderer-dist
          path: dist
      - name: Install Electron binary
        run: npx --no install-electron
      - name: Configure Electron sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Run smoke shard
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:all -- --skip-unit --shard=${{ matrix.shard }}/4
        env:
          TAGLINE_TEST_DIST_READY: '1'
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.shard }}
          path: test-all.log
          if-no-files-found: warn
          retention-days: 7
