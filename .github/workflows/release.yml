name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and release
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version))
              throw new Error('Invalid package version');
            if (lock.version !== version || lock.packages[''].version !== version)
              throw new Error('Update package-lock.json along with package.json');
            const tag = `v${version}`;
            const tags = execFileSync('git', ['tag', '--list', tag], { encoding: 'utf8' }).trim();
            if (tags && execFileSync('git', ['rev-parse', `${tag}^{commit}`], { encoding: 'utf8' }).trim() !== context.sha)
              throw new Error(`${tag} already points to another commit`);
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (!data.draft) throw new Error(`${tag} is already published. Bump the package version.`);
              if (!tags && data.target_commitish !== context.sha)
                throw new Error(`${tag} has a draft for another commit. Delete that draft before retrying.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('version', version);
            core.setOutput('tag', tag);

  test:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Test platform-independent logic once
        run: npm run test:shared

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Test platform-dependent behavior
        run: npm run test:platform
      - run: npm run build
      - run: npm run test:installation
      - name: Package without publishing or signing
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  publish:
    needs: [version, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish complete release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        with:
          script: |
            const fs = require('node:fs');
            const { createHash } = require('node:crypto');
            const { execFileSync } = require('node:child_process');
            const { VERSION: version, TAG: tag } = process.env;
            const files = [
              `Tagline-${version}-win-x64.exe`,
              `Tagline-${version}-mac-x64.dmg`,
              `Tagline-${version}-mac-arm64.dmg`,
            ];
            const actual = fs.readdirSync('artifacts').sort();
            if (JSON.stringify(actual) !== JSON.stringify([...files].sort()))
              throw new Error(`Unexpected release files: ${actual.join(', ')}`);
            const checksums = files.map(name => {
              const hash = createHash('sha256').update(fs.readFileSync(`artifacts/${name}`)).digest('hex');
              return `${hash}  ${name}`;
            }).join('\n') + '\n';
            fs.writeFileSync('artifacts/SHA256SUMS.txt', checksums);
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }));
              if (!release.draft) throw new Error(`${tag} is already published`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const published = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const previous = published.find(candidate => {
              if (candidate.draft || candidate.tag_name === tag) return false;
              try {
                execFileSync('git', ['merge-base', '--is-ancestor', `refs/tags/${candidate.tag_name}`, context.sha]);
                return true;
              } catch (error) {
                if (error.status === 1) return false;
                throw error;
              }
            });
            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              ...context.repo, tag_name: tag, target_commitish: context.sha,
              ...(previous ? { previous_tag_name: previous.tag_name } : {}),
            });
            const range = previous ? `refs/tags/${previous.tag_name}..${context.sha}` : context.sha;
            const log = (...args) => execFileSync('git', ['log', ...args, '--'], {
              encoding: 'utf8',
            }).trim().split('\n').filter(Boolean);
            const records = log('--reverse', '--no-merges', '--format=%H%x00%s%x00%aE', range)
              .map(line => {
                const [sha, subject, email] = line.split('\0');
                return { sha, subject, email: email.toLowerCase() };
              });
            const changelogRecords = records.filter(record => !/^ignore:/i.test(record.subject));
            const marker = '<!-- tagline-release-commits -->';
            const retainedNotes = release?.body?.split(marker)[0] || notes.body;
            const representedPulls = new Set([...retainedNotes.matchAll(/https:\/\/github\.com\/([^/\s]+)\/([^/\s]+)\/pull\/(\d+)/g)]
              .filter(([, owner, repo]) => owner.toLowerCase() === context.repo.owner.toLowerCase() &&
                repo.toLowerCase() === context.repo.repo.toLowerCase()).map(match => Number(match[3])));
            const associations = new Map();
            const pullsFor = async sha => {
              if (!associations.has(sha)) associations.set(sha,
                await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                  ...context.repo, commit_sha: sha, per_page: 100,
                }));
              return associations.get(sha);
            };
            const direct = [];
            for (const record of changelogRecords) {
              if (/^(?:test|refactor)(?:\([^)]*\))?!?:/i.test(record.subject) ||
                /^Merge (?:pull request|branch|remote-tracking branch|tag)\b/i.test(record.subject)) continue;
              const pulls = await pullsFor(record.sha);
              if (pulls.some(pull => pull.merged_at && representedPulls.has(pull.number))) continue;
              direct.push(record);
            }
            const commitLimit = 20;
            const commits = direct.slice(-commitLimit).map(({ sha, subject }) => {
              const title = subject.replace(/[\\`*_[\]<>]/g, '\\$&');
              return `* ${title} ([${sha.slice(0, 7)}](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}))`;
            });
            const comparison = previous
              ? `https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${encodeURIComponent(previous.tag_name)}...${context.sha}`
              : `https://github.com/${context.repo.owner}/${context.repo.repo}/commits/${context.sha}`;
            if (direct.length > commitLimit) commits.push(
              `\nShowing the latest ${commitLimit} of ${direct.length} direct commits. [View full history](${comparison}).`);
            const oldEmails = new Set(previous
              ? log('--format=%aE', `refs/tags/${previous.tag_name}`).map(email => email.toLowerCase()) : []);
            const contributors = new Map();
            for (const record of changelogRecords) {
              if (oldEmails.has(record.email)) continue;
              oldEmails.add(record.email);
              const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: record.sha });
              const author = commit.author;
              if (!author || author.type === 'Bot' || /\[bot\]$/i.test(author.login) ||
                contributors.has(author.login.toLowerCase())) continue;
              if (previous) {
                const { data: earlier } = await github.rest.repos.listCommits({
                  ...context.repo, sha: `refs/tags/${previous.tag_name}`, author: author.login, per_page: 1,
                });
                if (earlier.length) continue;
              }
              const pull = (await pullsFor(record.sha)).find(pull => pull.merged_at &&
                pull.user?.login.toLowerCase() === author.login.toLowerCase() && representedPulls.has(pull.number));
              const link = pull
                ? `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pull.number}`
                : `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${record.sha}`;
              contributors.set(author.login.toLowerCase(), `* @${author.login} made their first contribution in ${link}`);
            }
            const withoutContributors = text => text.replace(
              /^## New Contributors[^\n]*\n[\s\S]*?(?=^## |^\*\*Full Changelog\*\*|(?![\s\S]))/gim, '').trimEnd();
            const introduction = 'Unsigned builds: Windows and macOS may show security warnings.\n\n' +
              'To update, open Settings > Installation in Tagline, check for updates, and download the matching installer. ' +
              'On Windows, choose Install update and restart; on macOS, open the downloaded DMG and replace Tagline in Applications. ' +
              'Settings, vaults, and revision history are retained. Checks and downloads are user-initiated.\n\n' +
              withoutContributors(notes.body);
            const existingNotes = release?.body || introduction;
            const body = withoutContributors(existingNotes.split(marker)[0]) +
              `\n\n${marker}\n\n## What's changed - commits\n\n` +
              (commits.join('\n') || 'No additional direct commits.') +
              (contributors.size ? `\n\n## New Contributors\n\n${[...contributors.values()].join('\n')}` : '') + '\n';
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.sha,
                name: `Tagline ${version}`, draft: true, prerelease: version.split('+')[0].includes('-'),
                body,
              }));
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: release.id, per_page: 100,
            });
            for (const asset of assets) await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: asset.id });
            for (const name of [...files, 'SHA256SUMS.txt']) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.id, name,
                data: fs.readFileSync(`artifacts/${name}`),
              });
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, body, draft: false });
            await core.summary.addLink(`Tagline ${version}`, release.html_url).write();
