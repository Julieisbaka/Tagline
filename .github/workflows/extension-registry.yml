name: Extension registry

on:
  pull_request:
    branches: [main]
    paths:
      - extensions/registry.json
      - schemas/extension-registry.schema.json
      - electron/extensionRegistry.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate registry format
        run: node --test tests/extension-registry.test.cjs

      - name: Check listed extension manifests
        run: node scripts/check-extension-registry.cjs
