name: Feature request
description: Suggest a feature or improvement for Tagline.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea! Search existing issues first, and keep each
        request focused on one improvement. Do not include private information.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what makes it difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior you would like and how it would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Describe any existing settings, extensions, or other approaches you have tried or considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, sketches, or screenshots if helpful. Mention any relevant platform or accessibility needs.
