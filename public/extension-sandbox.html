        } else if (data.type === 'vault-event') {
          try { await watches.get(data.id)?.(data.event); }
          catch (error) { send({ type: 'error', message: describe(error) }); }
        } else if (data.type === 'active-note-event') {
          try { await activeNoteWatches.get(data.id)?.(data.event); }
          catch (error) { send({ type: 'error', message: describe(error) }); }
        } else if (data.type === 'application-event') {
          try { await eventWatches.get(data.id)?.(data.event); }
          catch (error) { send({ type: 'error', message: describe(error) }); }
        } else if (data.type === 'surface-event') {
          for (const listener of [...(surfaceListeners.get(data.id) || [])]) {
            try { await listener(data.event); }
            catch (error) { send({ type: 'error', message: describe(error) }); }
          }
        } else if (data.type === 'command') {
          try { await handlers.get(data.command)?.(); }
          catch (error) { send({ type: 'error', message: describe(error) }); }
        }
      });
    };
    addEventListener('message', (event) => {
      if (event.source !== parent || !event.data) return;
      const data = event.data;
      if (data.type === 'start' && !started) {
        started = true;
        limits = Object.freeze(data.limits);
        const url = URL.createObjectURL(new Blob([`(${workerMain.toString()})();`], { type: 'text/javascript' }));
        try { worker = new Worker(url); }
        catch (error) { fail(String(error.message)); return; }
        finally { URL.revokeObjectURL(url); }
        lastHeartbeat = performance.now();
        worker.onmessage = ({ data: message }) => {
          const now = performance.now();
          if (message.type === 'heartbeat') { lastHeartbeat = now; return; }
          while (messageTimes.length && messageTimes[0] <= now - 1000) messageTimes.shift();
          if (messageTimes.length >= limits.extensionMessagesPerSecond) { fail(`Extension exceeded ${limits.extensionMessagesPerSecond} messages per second and was stopped.`); return; }
          messageTimes.push(now);
          parent.postMessage(message, '*');
        };
        worker.onerror = (event) => { event.preventDefault(); fail(event.message || 'Extension worker failed.'); };
        watchdog = setInterval(() => {
          if (performance.now() - lastHeartbeat > limits.extensionHeartbeatMs) fail(`Extension stopped responding for ${limits.extensionHeartbeatMs / 1000} seconds and was stopped.`);
        }, 500);
        worker.postMessage(data);
      } else if (worker && ['result', 'command', 'vault-event', 'active-note-event', 'application-event', 'surface-event'].includes(data.type)) {
        worker.postMessage(data);
      }
    });
  })();
</script>
