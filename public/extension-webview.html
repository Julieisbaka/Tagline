<!doctype html>
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'">

<body></body>
<script>
  (() => {
    const listeners = new Set();
    const themeListeners = new Set();
    let theme = {};
    let appliedVariables = [];
    let started = false;
    const sendError = (error) => parent.postMessage({
      type: 'extension-ui-error', message: String(error?.message || error)
    }, '*');
    window.taglineWebview = Object.freeze({
      /** Send JSON to this surface's extension worker. No app DOM or filesystem access.
       * @param {*} payload JSON-serializable message (up to 65,536 characters). @returns {void}
       */
      postMessage: (payload) => parent.postMessage({ type: 'extension-ui-message', payload }, '*'),
      /** Subscribe to worker messages. @param {function} listener JSON handler. @returns {() => boolean} Disposer. */
      onMessage: (listener) => {
        if (typeof listener !== 'function') throw new TypeError('Expected a listener.');
        listeners.add(listener);
        return () => listeners.delete(listener);
      },
      /** Return a clone of the current theme, including variables and reduced-motion preference. @returns {object} */
      getTheme: () => structuredClone(theme),
      /** Subscribe to theme changes without reloading the surface. @returns {() => boolean} Disposer. */
      onThemeChange: (listener) => {
        if (typeof listener !== 'function') throw new TypeError('Expected a listener.');
        themeListeners.add(listener);
        return () => themeListeners.delete(listener);
      },
    });
    const text = (value) => {
      if (typeof value !== 'string' || !value.trim()) throw new TypeError('A nonempty label is required.');
      return value;
    };
    const element = (tag, className, children = []) => {
      const el = document.createElement(tag);
      el.className = className;
      el.append(...children);
      return el;
    };
    let fieldId = 0;
    const field = (options, control, eventName) => {
      const label = element('label', 'tl-field');
      const id = `tl-field-${++fieldId}`;
      control.id = id;
      label.htmlFor = id;
      label.append(element('span', '', [text(options.label)]), control);
      control.disabled = !!options.disabled;
      if (options.description) {
        const description = element('small', '', [String(options.description)]);
        description.id = `${id}-description`;
        control.setAttribute('aria-describedby', description.id);
        label.append(description);
      }
      if (options.onChange) control.addEventListener(eventName, () =>
        options.onChange(control.type === 'checkbox' ? control.checked : control.value));
      return label;
    };
    window.taglineUI = Object.freeze({
      /** Build a themed button. @param {{label:string,variant?:'default'|'primary',onClick?:function,disabled?:boolean}} options
       * @returns {HTMLButtonElement}
       */
      button: ({ label, variant = 'default', onClick, disabled = false }) => {
        if (!['default', 'primary'].includes(variant)) throw new TypeError('Unknown button variant.');
        const el = element('button', variant === 'primary' ? 'primary' : '', [text(label)]);
        el.type = 'button'; el.disabled = disabled;
        if (onClick) el.addEventListener('click', onClick);
        return el;
      },
      /** Build a labeled input/textarea; onChange receives its string value.
       * @param {{label:string,type?:string,value?:string,description?:string,disabled?:boolean,onChange?:function}} options
       * Also accepts min, max, step, maxLength and placeholder. @returns {HTMLLabelElement}
       */
      field: (options) => {
        const { type = 'text', value = '' } = options;
        if (!['text', 'number', 'search', 'email', 'url', 'password', 'textarea', 'color'].includes(type)) throw new TypeError('Unknown field type.');
        const control = document.createElement(type === 'textarea' ? 'textarea' : 'input');
        if (type !== 'textarea') control.type = type;
        control.value = value;
        for (const key of ['min', 'max', 'step', 'maxLength', 'placeholder']) {
          if (options[key] !== undefined) control[key] = options[key];
        }
        return field(options, control, 'input');
      },
      /** Build a labeled select; options contains {label,value} entries and onChange receives a string.
       * @param {{label:string,options:object[],value:string,onChange?:function,description?:string,disabled?:boolean}} options
       * @returns {HTMLLabelElement}
       */
      select: (options) => {
        const control = document.createElement('select');
        for (const option of options.options) {
          control.append(new Option(text(option.label), String(option.value)));
        }
        control.value = options.value;
        return field(options, control, 'change');
      },
      /** Build a labeled checkbox; onChange receives a boolean.
       * @param {{label:string,checked?:boolean,onChange?:function,description?:string,disabled?:boolean}} options
       * @returns {HTMLLabelElement}
       */
      toggle: (options) => {
        const control = document.createElement('input');
        control.type = 'checkbox'; control.checked = !!options.checked;
        const label = field(options, control, 'change');
        label.classList.add('tl-toggle');
        return label;
      },
      /** Stack child DOM nodes with shared app spacing. @param {{children?:Node[]}} options @returns {HTMLDivElement} */
      stack: ({ children = [] } = {}) => element('div', 'tl-stack', children),
      /** Group a title and child nodes in a themed card. @param {{title:string,children?:Node[]}} options @returns {HTMLElement} */
      card: ({ title, children = [] }) => element('section', 'tl-card', [
        element('h3', '', [text(title)]), element('div', 'tl-stack', children),
      ]),
      /** Build a status message (or alert for errors). @param {{text:string,tone?:'info'|'warning'|'error'}} options
       * @returns {HTMLParagraphElement}
       */
      notice: ({ text: message, tone = 'info' }) => {
        if (!['info', 'warning', 'error'].includes(tone)) throw new TypeError('Unknown notice tone.');
        const el = element('p', 'tl-notice', [text(message)]);
        el.dataset.tone = tone; el.setAttribute('role', tone === 'error' ? 'alert' : 'status');
        return el;
      },
    });
    const applyTheme = (next) => {
      if (JSON.stringify(next) === JSON.stringify(theme)) return;
      theme = next;
      document.documentElement.classList.add('tl-theme-updating');
      for (const key of appliedVariables) document.documentElement.style.removeProperty(key);
      appliedVariables = Object.keys(next.variables);
      for (const [key, value] of Object.entries(next.variables)) document.documentElement.style.setProperty(key, value);
      document.documentElement.style.colorScheme = next.mode;
      document.documentElement.dataset.theme = next.id;
      document.body.getBoundingClientRect();
      document.documentElement.classList.remove('tl-theme-updating');
      for (const listener of themeListeners) {
        try { Promise.resolve(listener(structuredClone(next))).catch(sendError); }
        catch (error) { sendError(error); }
      }
    };
    addEventListener('error', (event) => sendError(event.message));
    addEventListener('unhandledrejection', (event) => sendError(event.reason));
    addEventListener('message', (event) => {
      if (event.source !== parent || !event.data) return;
      if (event.data.type === 'initialize' && !started) {
        started = true;
        applyTheme(event.data.theme);
        document.documentElement.lang = event.data.language;
        const baseStyle = document.createElement('style');
        baseStyle.textContent = event.data.css + '\n*{box-sizing:border-box}body{margin:0;padding:12px;background:var(--bg);color:var(--text);font:14px var(--font-ui);line-height:1.5}';
        document.head.append(baseStyle);
        const parsed = new DOMParser().parseFromString(event.data.html, 'text/html');
        for (const style of parsed.head.querySelectorAll('style')) document.head.append(style.cloneNode(true));
        document.body.replaceChildren(...[...parsed.body.childNodes].map(node => node.cloneNode(true)));
        for (const old of [...parsed.head.querySelectorAll('script'), ...document.body.querySelectorAll('script')]) {
          const script = document.createElement('script');
          script.textContent = old.textContent;
          if (old.parentNode === parsed.head) document.body.append(script);
          else old.replaceWith(script);
        }
      } else if (event.data.type === 'extension-ui-theme' && started) {
        applyTheme(event.data.theme);
      } else if (event.data.type === 'extension-ui-message') {
        for (const listener of [...listeners]) {
          try { Promise.resolve(listener(event.data.payload)).catch(sendError); }
          catch (error) { sendError(error); }
        }
      }
    });
  })();
</script>
